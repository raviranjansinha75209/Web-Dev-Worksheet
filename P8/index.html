<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Navbar and Card Overlay</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a href="#" class="brand">My Portfolio</a>
        <div class="nav-links">
            <a href="#about">About</a>
            <a href="#work">Work</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <main>
        <section class="hero" id="about">
            <h1>Welcome to my page</h1>
            <p>Scroll down to see the sticky navigation bar stay at the top.</p>
        </section>

        <section class="cards" id="work">
            <article class="card">
                <div class="card-image">Project 01</div>
                <div class="card-content">
                    <h2>Portfolio website</h2>
                    <p>A simple page made using HTML and CSS.</p>
                </div>
                <span class="card-label">Featured</span>
            </article>
            <article class="card">
                <div class="card-image second">Project 02</div>
                <div class="card-content">
                    <h2>Practice layout</h2>
                    <p>Trying out CSS positioning and spacing.</p>
                </div>
                <span class="card-label">Practice</span>
            </article>
        </section>
        <footer id="contact">End of page</footer>
    </main>
</body>
</html>
